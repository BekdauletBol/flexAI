# ============================================
# FlexAI Production Docker Compose
# For 30K+ users, zero-error tolerance
# ============================================

version: '3.8'

services:
  flexai:
    container_name: flexai-bot-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: flexai:production-${VERSION:-latest}

    # Only bind to localhost if behind load balancer
    # Remove 127.0.0.1: if this is the only instance
    ports:
      - "3000:3000"

    env_file:
      - .env.production

    environment:
      - NODE_ENV=production
      - LOG_LEVEL=warn
      - PORT=3000
      - FLEXAI_DB_PATH=/app/data/flexai.db
      # Performance tuning
      - NODE_OPTIONS=--max-old-space-size=6144 --gc-interval=100

    volumes:
      # Persistent data
      - ./data:/app/data
      - ./temp:/app/temp
      - ./logs:/app/logs
      # Read-only configs (optional)
      # - ./config:/app/config:ro

    # Always restart unless manually stopped
    restart: always

    # Grace period for graceful shutdown
    stop_grace_period: 30s

    # Health check configuration
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--timeout=5", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - flexai-network

    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

      # Restart policy
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        compress: "true"
        labels: "service=flexai,environment=production"

    # Security hardening
    security_opt:
      - no-new-privileges:true

    # Read-only root filesystem for security
    read_only: true

    # Writable temp directory
    tmpfs:
      - /tmp:noexec,nosuid,size=2G

    # Drop all capabilities, add only what's needed
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # For binding to port 3000

    # Labels for management
    labels:
      com.flexai.service: "telegram-bot"
      com.flexai.environment: "production"
      com.flexai.version: "${VERSION:-latest}"

networks:
  flexai-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: flexai0

# Named volumes for better management
volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data

  temp:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/temp

  logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/logs
